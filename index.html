<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weatherly — Weather Dashboard</title>
<style>
:root{--bg:#0b1220;--panel:#131e30;--panel2:#1a2940;--text:#eef5ff;--muted:#9aacc5;--accent:#75c9ff;--line:#263852}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172d49 0,#0b1220 55%);color:var(--text);font:15px/1.5 Inter,system-ui,Segoe UI,Arial,sans-serif;min-height:100vh}
main{max-width:1180px;margin:auto;padding:28px 20px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.brand{font-size:24px;font-weight:800;letter-spacing:-.8px}.brand span{color:var(--accent)}.search{display:flex;gap:8px;flex:1;max-width:600px}
input,button{font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px 15px}input{background:#0d1828;color:var(--text);flex:1;min-width:100px;outline:none}input:focus{border-color:var(--accent)}button{background:var(--panel2);color:var(--text);cursor:pointer;transition:.2s}button:hover{filter:brightness(1.2);transform:translateY(-1px)}.primary{background:var(--accent);color:#092035;border-color:transparent;font-weight:700}
.toolbar{display:flex;gap:8px}.error{color:#ffb4b4;margin:8px 0;min-height:20px}.muted{color:var(--muted)}.section-title{font-size:17px;margin:0 0 14px;font-weight:700}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.panel{background:linear-gradient(145deg,rgba(26,41,64,.96),rgba(16,27,44,.96));border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 14px 35px #0002;min-width:0}
.current{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.place{font-size:24px;font-weight:750}.date{color:var(--muted)}.temp{font-size:64px;line-height:1.1;font-weight:750;letter-spacing:-3px}.condition{font-size:18px}.weather-icon{font-size:68px;filter:drop-shadow(0 8px 15px #0003)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.stat{background:#0d1929a8;border:1px solid #263852;border-radius:13px;padding:12px}.stat small{display:block;color:var(--muted);margin-bottom:5px}.stat b{font-size:17px}
.hourly{display:flex;gap:10px;overflow-x:auto;padding-bottom:5px}.hour{background:#0d1929a8;border:1px solid #263852;border-radius:14px;min-width:82px;text-align:center;padding:12px 8px}.hour .ico{font-size:24px;margin:8px 0}.hour b{display:block}.hour small{color:var(--muted)}
.daily{display:grid;gap:8px}.day{display:grid;grid-template-columns:1.2fr 40px 1fr auto;align-items:center;gap:10px;padding:10px 12px;background:#0d1929a8;border:1px solid #263852;border-radius:12px}.dayname{font-weight:650}.dayicon{text-align:center;font-size:22px}.bar{height:6px;border-radius:9px;background:#293c55;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#73caff,#ffd16b);border-radius:9px}.range{display:flex;align-items:center;gap:9px;min-width:95px}.range small{color:var(--muted)}.wide{grid-column:1/-1}.footer{text-align:center;color:#7187a4;font-size:12px;margin-top:24px}
@media(max-width:760px){main{padding:18px 12px 35px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.panel{padding:17px}.temp{font-size:54px}.stats{grid-template-columns:repeat(2,1fr)}.day{grid-template-columns:1fr 30px 1fr auto;padding:9px 8px;font-size:13px}.range{min-width:80px;gap:5px}}
</style>
</head>
<body>
<main>
<header class="top">
  <div class="brand">☁ Weather<span>ly</span></div>
  <form class="search" id="searchForm">
    <input id="cityInput" placeholder="Search a city (e.g. Lagos)" aria-label="City name" autocomplete="off">
    <button class="primary" type="submit">Search</button>
  </form>
  <div class="toolbar"><button id="geoBtn" title="Use my location">◎ Locate</button><button id="unitBtn" title="Switch temperature units">°C / °F</button></div>
</header>
<div class="error" id="error" role="status"></div>
<div class="grid">
  <section class="panel">
    <div class="current">
      <div><div class="place" id="place">Lagos, Nigeria</div><div class="date" id="date"></div><div class="temp" id="temp">--°</div><div class="condition" id="condition">Loading weather…</div><div class="muted" id="feels"></div></div>
      <div class="weather-icon" id="bigIcon">🌤️</div>
    </div>
    <div class="stats">
      <div class="stat"><small>💧 Humidity</small><b id="humidity">--%</b></div>
      <div class="stat"><small>💨 Wind</small><b id="wind">-- km/h</b></div>
      <div class="stat"><small>🌡️ Feels like</small><b id="feelsStat">--°</b></div>
      <div class="stat"><small>🌧️ Precipitation</small><b id="rain">-- mm</b></div>
      <div class="stat"><small>☀️ UV index</small><b id="uv">--</b></div>
      <div class="stat"><small>🌅 Sunrise</small><b id="sunrise">--:--</b></div>
    </div>
  </section>
  <section class="panel">
    <h2 class="section-title">Next 24 hours</h2>
    <div class="hourly" id="hourly"><span class="muted">Loading hourly forecast…</span></div>
  </section>
  <section class="panel wide">
    <h2 class="section-title">7-day forecast</h2>
    <div class="daily" id="daily"><span class="muted">Loading daily forecast…</span></div>
  </section>
</div>
<div class="footer">Weather data by Open-Meteo · No API key required</div>
<script>
// ==========================================
// WEATHERLY — UPGRADED WEATHER ENGINE
// ==========================================

const $ = id => document.getElementById(id);

let isF = false;
let requestId = 0;

let current = {
    lat: 6.5244,
    lon: 3.3792,
    name: "Lagos",
    country: "Nigeria"
};

// Weather codes from the Open-Meteo API
const codes = {
    0: ["Clear sky", "☀️"],
    1: ["Mainly clear", "🌤️"],
    2: ["Partly cloudy", "⛅"],
    3: ["Overcast", "☁️"],
    45: ["Fog", "🌫️"],
    48: ["Depositing rime fog", "🌫️"],
    51: ["Light drizzle", "🌦️"],
    53: ["Drizzle", "🌦️"],
    55: ["Dense drizzle", "🌧️"],
    56: ["Freezing drizzle", "🌧️"],
    57: ["Heavy freezing drizzle", "🌧️"],
    61: ["Slight rain", "🌦️"],
    63: ["Moderate rain", "🌧️"],
    65: ["Heavy rain", "🌧️"],
    66: ["Freezing rain", "🌧️"],
    67: ["Heavy freezing rain", "🌧️"],
    71: ["Slight snow", "🌨️"],
    73: ["Moderate snow", "🌨️"],
    75: ["Heavy snow", "❄️"],
    77: ["Snow grains", "🌨️"],
    80: ["Rain showers", "🌦️"],
    81: ["Moderate showers", "🌧️"],
    82: ["Violent showers", "⛈️"],
    85: ["Snow showers", "🌨️"],
    86: ["Heavy snow showers", "❄️"],
    95: ["Thunderstorm", "⛈️"],
    96: ["Thunderstorm with hail", "⛈️"],
    99: ["Thunderstorm with heavy hail", "⛈️"]
};

function weather(code) {
    return codes[code] || ["Unknown conditions", "🌡️"];
}

// Convert Celsius to Fahrenheit when required
function temp(c) {
    if (c == null || !Number.isFinite(Number(c))) return "--°";

    return Math.round(isF ? c * 9 / 5 + 32 : c) +
        (isF ? "°F" : "°C");
}

// Convert wind speed to the selected unit
function wind(value) {
    if (value == null) return "--";

    const speed = isF ? value * 0.621371 : value;

    return `${Math.round(speed)} ${isF ? "mph" : "km/h"}`;
}

// Format a time using the device's locale
function time(value) {
    if (!value) return "--:--";

    return new Date(value).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });
}

function day(date, index) {
    if (index === 0) return "Today";

    return new Date(date + "T12:00:00").toLocaleDateString([], {
        weekday: "short"
    });
}

// Display errors without hiding useful information
function showError(message) {
    $("error").textContent = message;
}

// Check API responses and provide readable errors
async function getJSON(url) {
    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            `Weather service error (${response.status}). Please try again.`
        );
    }

    return response.json();
}

// ==========================================
// LOAD WEATHER
// ==========================================

async function loadWeather() {
    const thisRequest = ++requestId;

    showError("");

    $("place").textContent =
        current.name + (current.country ? ", " + current.country : "");

    $("condition").textContent = "Fetching latest forecast…";

    $("hourly").innerHTML =
        '<span class="muted">Loading hourly forecast…</span>';

    $("daily").innerHTML =
        '<span class="muted">Loading daily forecast…</span>';

    try {
        const url =
            "https://api.open-meteo.com/v1/forecast" +
            `?latitude=${current.lat}` +
            `&longitude=${current.lon}` +
            "&current=temperature_2m,relative_humidity_2m," +
            "apparent_temperature,is_day,precipitation," +
            "weather_code,wind_speed_10m" +
            "&hourly=temperature_2m,precipitation_probability,weather_code" +
            "&daily=weather_code,temperature_2m_max,temperature_2m_min," +
            "uv_index_max,sunrise,sunset" +
            "&forecast_days=7&timezone=auto";

        const data = await getJSON(url);

        // Ignore older responses if the user searched again
        if (thisRequest !== requestId) return;

        if (!data.current || !data.daily || !data.hourly) {
            throw new Error("The weather service returned incomplete data.");
        }

        const c = data.current;
        const conditions = weather(c.weather_code);

        // Current weather
        $("date").textContent = new Date().toLocaleDateString([], {
            weekday: "long",
            month: "long",
            day: "numeric"
        });

        $("temp").textContent = temp(c.temperature_2m);
        $("condition").textContent = conditions[0];
        $("bigIcon").textContent = conditions[1];

        $("humidity").textContent =
            c.relative_humidity_2m + "%";

        $("wind").textContent =
            wind(c.wind_speed_10m);

        $("feels").textContent =
            "Feels like " + temp(c.apparent_temperature);

        $("feelsStat").textContent =
            temp(c.apparent_temperature);

        $("rain").textContent =
            (c.precipitation ?? 0) + " mm";

        $("uv").textContent =
            data.daily.uv_index_max?.[0] ?? "--";

        $("sunrise").textContent =
            time(data.daily.sunrise?.[0]);

        // ======================================
        // NEXT 24 HOURS
        // ======================================

        const hourly = data.hourly;

        const currentHour = hourly.time.findIndex(
            t => new Date(t).getTime() >=
                new Date(c.time).getTime()
        );

        const start = currentHour < 0 ? 0 : currentHour;

        $("hourly").innerHTML = Array.from(
            { length: 24 },
            (_, index) => start + index
        )
            .filter(index => index < hourly.time.length)
            .map(index => {
                const condition = weather(
                    hourly.weather_code[index]
                );

                return `
                    <div class="hour">
                        <small>
                            ${index === start
                                ? "Now"
                                : time(hourly.time[index])}
                        </small>

                        <div class="ico">${condition[1]}</div>

                        <b>${temp(hourly.temperature_2m[index])}</b>

                        <small>
                            💧 ${hourly.precipitation_probability[index] ?? 0}%
                        </small>
                    </div>
                `;
            })
            .join("");

        // ======================================
        // 7-DAY FORECAST
        // ======================================

        const daily = data.daily;

        const lows = daily.temperature_2m_min;
        const highs = daily.temperature_2m_max;

        const minimum = Math.min(...lows);
        const maximum = Math.max(...highs);

        const span = maximum - minimum || 1;

        $("daily").innerHTML = daily.time.map((date, index) => {
            const condition = weather(daily.weather_code[index]);

            const left =
                ((lows[index] - minimum) / span) * 100;

            const width = Math.max(
                5,
                ((highs[index] - lows[index]) / span) * 100
            );

            return `
                <div class="day">
                    <div class="dayname">
                        ${day(date, index)}
                        <div class="muted">${condition[0]}</div>
                    </div>

                    <div class="dayicon">${condition[1]}</div>

                    <div class="bar">
                        <span style="
                            margin-left:${left}%;
                            width:${width}%;
                        "></span>
                    </div>

                    <div class="range">
                        <small>${temp(lows[index])}</small>
                        <b>${temp(highs[index])}</b>
                    </div>
                </div>
            `;
        }).join("");

        showError("");

    } catch (error) {
        if (thisRequest !== requestId) return;

        console.error("Weatherly error:", error);

        $("condition").textContent = "Could not load weather";

        $("hourly").innerHTML =
            '<span class="muted">Hourly forecast unavailable.</span>';

        $("daily").innerHTML =
            '<span class="muted">Daily forecast unavailable.</span>';

        showError(
            error.message ||
            "Unable to load weather. Check your internet connection."
        );
    }
}

// ==========================================
// CITY SEARCH
// ==========================================

async function searchCity(name) {
    name = name.trim();

    if (!name) {
        showError("Enter a city name first.");
        return;
    }

    showError("Searching for " + name + "…");

    try {
        const url =
            "https://geocoding-api.open-meteo.com/v1/search" +
            `?name=${encodeURIComponent(name)}` +
            "&count=1&language=en&format=json";

        const data = await getJSON(url);

        if (!data.results?.length) {
            throw new Error("City not found. Try another name.");
        }

        const place = data.results[0];

        current = {
            lat: place.latitude,
            lon: place.longitude,
            name: place.name,
            country: place.country || ""
        };

        $("cityInput").value = "";

        await loadWeather();

    } catch (error) {
        showError(
            error.message || "Unable to search for that city."
        );
    }
}

$("searchForm").addEventListener("submit", event => {
    event.preventDefault();

    searchCity($("cityInput").value);
});

// ==========================================
// TEMPERATURE UNIT SWITCH
// ==========================================

$("unitBtn").addEventListener("click", () => {
    isF = !isF;

    $("unitBtn").textContent = isF
        ? "Switch to °C"
        : "Switch to °F";

    // Re-render weather in the selected units
    loadWeather();
});

// ==========================================
// LIVE LOCATION
// ==========================================

async function locateMe() {
    if (!window.isSecureContext) {
        showError(
            "Live location requires HTTPS. Open Weatherly using its GitHub Pages address."
        );
        return;
    }

    if (!navigator.geolocation) {
        showError(
            "Your browser does not support live location."
        );
        return;
    }

    const button = $("geoBtn");

    button.disabled = true;
    button.textContent = "Locating…";

    showError("Requesting your location…");

    // Get the device's coordinates
    navigator.geolocation.getCurrentPosition(
        async position => {
            try {
                current = {
                    lat: position.coords.latitude,
                    lon: position.coords.longitude,
                    name: "Your location",
                    country: ""
                };

                showError("Location found! Loading local weather…");

                // Reverse geocode coordinates into a place name
                try {
                    const url =
                        "https://geocoding-api.open-meteo.com/v1/reverse" +
                        `?latitude=${current.lat}` +
                        `&longitude=${current.lon}` +
                        "&language=en&format=json";

                    const data = await getJSON(url);

                    if (data.results?.length) {
                        const place = data.results[0];

                        current.name =
                            place.name ||
                            place.city ||
                            place.locality ||
                            "Your location";

                        current.country = place.country || "";
                    }
                } catch (error) {
                    // Weather can still load without a place name
                    console.warn("Reverse geocoding failed:", error);
                }

                await loadWeather();

            } finally {
                button.disabled = false;
                button.textContent = "◎ Locate";
            }
        },

        error => {
            button.disabled = false;
            button.textContent = "◎ Locate";

            switch (error.code) {
                case 1:
                    showError(
                        "Location permission denied. Allow location access for this site in Chrome settings, then try again."
                    );
                    break;

                case 2:
                    showError(
                        "Your location is unavailable. Check your device's location setting and try again."
                    );
                    break;

                case 3:
                    showError(
                        "Location request timed out. Try again with your device's location turned on."
                    );
                    break;

                default:
                    showError(
                        "Unable to get your location. Please try again."
                    );
            }
        },

        {
            enableHighAccuracy: false,
            timeout: 20000,
            maximumAge: 60000
        }
    );
}

$("geoBtn").addEventListener("click", locateMe);

// ==========================================
// INITIAL WEATHER
// ==========================================

loadWeather();

// Refresh the weather every 10 minutes
setInterval(() => {
    loadWeather();
}, 10 * 60 * 1000);
</script>
</body>
</html>
